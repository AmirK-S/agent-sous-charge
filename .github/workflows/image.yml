# D1 · Construit l'image de l'expérience et la publie sur GitHub (ghcr.io), publique (décision d'Amir, 21/10).
# Déclenchement : à la main, ou quand docker/ change.
name: image

on:
  workflow_dispatch:
  push:
    paths: ["docker/**", ".github/workflows/image.yml"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/amirk-s/agent-sous-charge-gpu

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Les machines standard de GitHub n'ont qu'environ 14 Go libres ; l'image en fait 15 à 20.
      - name: Libérer de la place sur le disque
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Connexion au registre de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ${{ env.IMAGE }}:vllm0.32.0-tau96a3ef92
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=vLLM 0.32.0 et tau2-bench 96a3ef92 préinstallés (expérience agent sous charge)

      - name: Taille de l'image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:vllm0.32.0-tau96a3ef92 | head -20
